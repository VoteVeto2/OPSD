# Single-GPU config (e.g. one Colab A100). With one process ZeRO-2 shards nothing,
# so DeepSpeed is dropped; LoRA params/optimizer stay in fp32 as under ZeRO-2 bf16.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: 'NO'
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: 'bf16'
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
