[project]
name = "opsd"
version = "0.1.0"
description = "On-Policy Self-Distillation (OPSD) for LLM reasoning"
readme = "README.md"
requires-python = "==3.10.*"
# Mirrors environment.yml (conda) one-to-one, plus flash-attn.
dependencies = [
    "torch==2.8.0",
    "accelerate==1.11.0",
    "transformers==4.57.1",
    "trl==0.26.0",
    "datasets==3.6.0",
    "deepspeed==0.18.2",
    "peft==0.17.1",
    "bitsandbytes==0.48.2",
    "wandb==0.22.3",
    "vllm==0.11.0",
    "xformers==0.0.32.post1",
    "triton==3.4.0",
    "einops==0.8.1",
    "safetensors==0.5.3",
    "sentencepiece==0.1.99",
    "tiktoken==0.9.0",
    "math-verify==0.8.0",
    "flash-attn==2.8.3",
]

[tool.uv]
package = false
# Training/eval only runs on Linux + CUDA; don't try to resolve for macOS/Windows.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
# Prebuilt wheel (torch 2.8 / CUDA 12 / cp310) — avoids a ~1h source build.
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp310-cp310-linux_x86_64.whl" }
